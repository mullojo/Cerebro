name: Publish alpha release
on:
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: alpha/package-lock.json
      - name: Validate version and release notes
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';
          import assert from 'node:assert/strict';
          const pkg = JSON.parse(fs.readFileSync('alpha/package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('alpha/package-lock.json', 'utf8'));
          assert.match(pkg.version, /^\d+\.\d+\.\d+$/);
          assert.equal(process.env.GITHUB_REF_NAME, `v${pkg.version}`);
          assert.equal(lock.version, pkg.version);
          assert.equal(lock.packages[''].version, pkg.version);
          assert.ok(fs.readFileSync(`alpha/releases/v${pkg.version}.md`, 'utf8').trim());
          JS
      - run: npm ci
        working-directory: alpha
      - run: npm run build
        working-directory: alpha
      - run: git diff --exit-code
      - run: npm run check:public
        working-directory: alpha
      - run: npm test
        working-directory: alpha
      - name: Package tagged public source
        run: |
          git archive --format=zip --prefix="Cerebro-${GITHUB_REF_NAME}/" HEAD -o "cerebro-${GITHUB_REF_NAME}.zip"
          sha256sum "cerebro-${GITHUB_REF_NAME}.zip" > "cerebro-${GITHUB_REF_NAME}.zip.sha256"
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "cerebro-${GITHUB_REF_NAME}.zip" "cerebro-${GITHUB_REF_NAME}.zip.sha256" \
            --verify-tag --prerelease --title "Cerebro ${GITHUB_REF_NAME} — local alpha" \
            --notes-file "alpha/releases/${GITHUB_REF_NAME}.md"
